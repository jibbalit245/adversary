# accelerate_config.yaml
# -----------------------
# Accelerate configuration for multi-GPU QLoRA training.
# GPU count is NOT hardcoded — Accelerate auto-detects available GPUs.
# Override num_processes at launch time if needed:
#   accelerate launch --num_processes=4 --config_file train/accelerate_config.yaml ...
#
# For RunPod / cloud GPU environments, this config works with any
# number of GPUs. Set CUDA_VISIBLE_DEVICES before launching to
# restrict to a subset of GPUs.

compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU

# Set to 0 to auto-detect all available GPUs at launch time.
# Pass --num_processes N to the accelerate launch command to override.
num_processes: 0

# Mixed precision: bf16 is preferred for Ampere+ (A100, H100, etc.)
mixed_precision: bf16

# Gradient checkpointing is handled inside the training script.
# Accelerate's DeepSpeed integration is optional; FSDP is not used
# because LoRA + 4-bit quantization is incompatible with FSDP sharding.
fsdp_config: {}
deepspeed_config: {}

# Dynamo / torch.compile (optional speed-up on H100+)
dynamo_config:
  dynamo_backend: "no"

# Logging
main_process_port: 29500

# Machine rank for single-node multi-GPU (no need to change)
machine_rank: 0
main_process_ip: null
num_machines: 1
rdzv_backend: static
same_network: true
tpu_name: null
tpu_zone: null
use_cpu: false
